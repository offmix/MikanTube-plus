<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <link id="tabIcon" rel="icon" type="image/jpeg" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTPMiIU5F8QnFLsyFCsrCeJNUtk53s79A-6xHHBAcTF9g&amp;s=10">
  <title id="tabTitle">ホーム - Classroom</title>
  <style>
    :root {
      --bg: #fff;
      --surface: #fff;
      --surface-2: #f2f2f2;
      --surface-3: #e5e5e5;
      --text: #0f0f0f;
      --muted: #606060;
      --line: #e5e5e5;
      --accent: #ff8a3d;
      --accent-dark: #e96f1f;
      --on-accent: #2d1608;
      --shadow: 0 1px 2px rgba(0, 0, 0, .08);
      --radius: 12px;
    }
    :root[data-theme="dark"] {
      --bg: #0f0f0f;
      --surface: #0f0f0f;
      --surface-2: #272727;
      --surface-3: #3f3f3f;
      --text: #f1f1f1;
      --muted: #aaa;
      --line: #3f3f3f;
      --shadow: 0 1px 2px rgba(0, 0, 0, .35);
    }

    * { box-sizing: border-box; }
    html { background: var(--bg); color: var(--text); }
    body {
      margin: 0;
      min-width: 320px;
      font-family: Arial, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      font-size: 14px;
      line-height: 1.45;
      background: var(--bg);
    }
    button, input { font: inherit; }
    button { color: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    a { color: inherit; text-decoration: none; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .icon {
      width: 22px;
      height: 22px;
      display: block;
      fill: currentColor;
      flex: 0 0 auto;
    }
    .icon.small { width: 18px; height: 18px; }
    .icon.large { width: 28px; height: 28px; }

    .topbar {
      height: 64px;
      position: fixed;
      inset: 0 0 auto;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 22px;
      padding: 0 24px;
      background: rgba(255,255,255,.96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }
    :root[data-theme="dark"] .topbar { background: rgba(15,15,15,.96); }
    .menu-button, .round-button, .text-button {
      border: 0;
      background: transparent;
      cursor: pointer;
    }
    .menu-button, .round-button {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 50%;
    }
    .menu-button:hover, .round-button:hover { background: var(--surface-2); }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-width: 148px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -.04em;
    }
    .brand-mark {
      width: 30px;
      height: 22px;
      display: grid;
      place-items: center;
      color: white;
      background: var(--accent);
      border-radius: 7px;
    }
    .brand-mark .icon { width: 15px; height: 15px; }
    .brand-sub { font-size: 11px; font-weight: 400; color: var(--muted); letter-spacing: 0; }
    .search-wrap {
      position: relative;
      height: 42px;
      display: flex;
      flex: 1 1 680px;
      max-width: 720px;
      margin-left: auto;
      margin-right: auto;
    }
    .search-input {
      width: 100%;
      min-width: 80px;
      padding: 0 16px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid #c6c6c6;
      border-right: 0;
      border-radius: 22px 0 0 22px;
      outline: 0;
    }
    .search-input:focus { border-color: #1c62b9; box-shadow: inset 1px 0 #1c62b9, inset 0 1px #1c62b9, inset 0 -1px #1c62b9; }
    .search-button {
      width: 64px;
      display: grid;
      place-items: center;
      background: var(--surface-2);
      border: 1px solid #c6c6c6;
      border-radius: 0 22px 22px 0;
      cursor: pointer;
    }
    .search-button:hover { background: var(--surface-3); }
    .search-history-panel {
      position: absolute;
      top: 48px;
      left: 0;
      right: 0;
      z-index: 25;
      overflow: hidden;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,.16);
    }
    .search-history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    .search-history-clear {
      padding: 4px 0;
      color: #2563eb;
      background: transparent;
      border: 0;
      cursor: pointer;
    }
    .search-history-list { display: grid; gap: 2px; padding: 0 6px 7px; }
    .search-history-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      padding: 8px;
      border-radius: 8px;
    }
    .search-history-row:hover { background: var(--surface-2); }
    .search-history-term {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      flex: 1;
      padding: 0;
      color: var(--text);
      text-align: left;
      background: transparent;
      border: 0;
      cursor: pointer;
    }
    .search-history-term span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .search-history-remove {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
    }
    .search-history-remove:hover { color: var(--text); background: var(--surface-3); }
    .history-row { position: relative; }
    .history-remove-button {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 2;
      padding: 6px 9px;
      color: var(--muted);
      background: color-mix(in srgb, var(--surface) 90%, transparent);
      border: 1px solid var(--line);
      border-radius: 7px;
      cursor: pointer;
    }
    .history-remove-button:hover { color: var(--text); background: var(--surface-2); }
    .history-clear-button { margin-left: auto; }
    .top-actions { display: flex; align-items: center; gap: 5px; margin-left: auto; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #16a34a;
    }
    .status.busy .status-dot { background: #eab308; }
    .status.error .status-dot { background: #dc2626; }

    .layout { display: flex; padding-top: 64px; }
    .sidebar {
      width: 240px;
      height: calc(100vh - 64px);
      position: fixed;
      top: 64px;
      left: 0;
      overflow-y: auto;
      padding: 16px 12px;
      background: var(--surface);
      border-right: 1px solid var(--line);
      transition: transform .2s ease, width .2s ease;
      z-index: 10;
    }
    .sidebar.collapsed { width: 76px; }
    .sidebar.collapsed .nav-label, .sidebar.collapsed .nav-heading { display: none; }
    .sidebar.collapsed .nav-item { justify-content: center; padding-inline: 0; }
    .nav-section { padding: 0 0 12px; margin-bottom: 12px; border-bottom: 1px solid var(--line); }
    .nav-heading {
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
    }
    .nav-item {
      width: 100%;
      min-height: 42px;
      display: flex;
      align-items: center;
      gap: 22px;
      padding: 0 14px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      cursor: pointer;
      text-align: left;
    }
    .nav-item:hover, .nav-item.active { background: var(--surface-2); font-weight: 700; }
    .nav-item.active .icon { color: var(--accent); }
    .nav-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .content {
      width: calc(100% - 240px);
      min-height: calc(100vh - 64px);
      margin-left: 240px;
      transition: width .2s ease, margin .2s ease;
    }
    .sidebar.collapsed + .content { width: calc(100% - 76px); margin-left: 76px; }
    .page { max-width: 1520px; margin: 0 auto; padding: 22px 28px 60px; }

    .chip-row {
      display: flex;
      gap: 9px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 0 0 22px;
    }
    .chip-row::-webkit-scrollbar { display: none; }
    .chip {
      height: 34px;
      flex: 0 0 auto;
      padding: 0 15px;
      border: 0;
      border-radius: 8px;
      background: var(--surface-2);
      cursor: pointer;
    }
    .chip:hover, .chip.active { color: var(--on-accent); background: var(--text); }
    .page-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin: 4px 0 20px;
    }
    .page-title h1 { margin: 0; font-size: 22px; letter-spacing: -.03em; }
    .page-title p { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
    .channel-header {
      overflow: hidden;
      margin: -2px 0 22px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
    }
    .channel-banner {
      height: 176px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: linear-gradient(120deg, #ffb45b, #e96f1f 52%, #7048b8);
    }
    .channel-banner img { width: 100%; height: 100%; display: block; object-fit: cover; }
    .channel-profile {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 18px 22px 14px;
    }
    .channel-header-avatar {
      width: 82px;
      height: 82px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      overflow: hidden;
      color: white;
      background: #737373;
      border: 4px solid var(--surface);
      border-radius: 50%;
      font-size: 25px;
      font-weight: 700;
      margin-top: -54px;
    }
    .channel-header-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .channel-profile-main { min-width: 0; flex: 1; }
    .channel-profile-main h2 { overflow: hidden; margin: 0 0 4px; font-size: 23px; text-overflow: ellipsis; white-space: nowrap; }
    .channel-profile-main p { margin: 0; color: var(--muted); font-size: 13px; }
    .channel-subscribe-button { flex: 0 0 auto; }
    .channel-about { max-width: 780px; margin: 0; padding: 0 22px 16px; color: var(--muted); font-size: 13px; white-space: pre-wrap; }
    .channel-tabs {
      display: flex;
      gap: 25px;
      overflow-x: auto;
      padding: 0 22px;
      border-top: 1px solid var(--line);
    }
    .channel-dashboard {
      display: grid;
      gap: 14px;
      padding: 16px 22px 20px;
      border-top: 1px solid var(--line);
      background: color-mix(in srgb, var(--surface-2) 48%, var(--surface));
    }
    .channel-stat-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .channel-stat {
      min-width: 0;
      padding: 12px 14px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    .channel-stat-label {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 11px;
    }
    .channel-stat-value {
      display: block;
      overflow: hidden;
      font-size: 16px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .channel-tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .channel-filter-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
      color: var(--muted);
    }
    .channel-filter-input {
      width: min(100%, 420px);
      height: 36px;
      padding: 0 12px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: 0;
    }
    .channel-filter-input:focus { border-color: #3b82f6; }
    .channel-sort-select {
      height: 36px;
      padding: 0 9px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .channel-tab {
      min-height: 48px;
      padding: 0 2px;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-bottom: 3px solid transparent;
      cursor: pointer;
      font-weight: 700;
      white-space: nowrap;
    }
    .channel-tab.active, .channel-tab:hover { color: var(--text); border-bottom-color: var(--text); }
    .video-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 30px 16px;
    }
    .video-card { min-width: 0; cursor: pointer; }
    .thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #ddd;
      border-radius: 10px;
    }
    .thumb img { width: 100%; height: 100%; display: block; object-fit: cover; transition: transform .2s ease; }
    .video-card:hover .thumb img { transform: scale(1.025); }
    .duration {
      position: absolute;
      right: 6px;
      bottom: 6px;
      padding: 2px 5px;
      color: white;
      background: rgba(0,0,0,.82);
      border-radius: 4px;
      font-size: 12px;
      line-height: 1.2;
    }
    .card-body { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 10px; padding-top: 10px; }
    .channel-avatar {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      color: white;
      background: #737373;
      border-radius: 50%;
      font-size: 13px;
      font-weight: 700;
    }
    .channel-avatar img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      border-radius: 50%;
    }
    .avatar-fallback { display: block; }
    .avatar-fallback[hidden] { display: none !important; }
    .card-title {
      display: -webkit-box;
      overflow: hidden;
      margin: -2px 0 5px;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.35;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }
    .card-meta { display: flex; flex-wrap: wrap; gap: 2px 4px; color: var(--muted); font-size: 12px; }
    .card-meta span:not(:last-child)::after { content: "・"; margin-left: 4px; }

    .skeleton { pointer-events: none; }
    .skeleton .thumb, .skeleton .line, .skeleton .avatar {
      background: linear-gradient(100deg, #eee 30%, #f8f8f8 45%, #eee 60%);
      background-size: 200% 100%;
      animation: shine 1.2s infinite;
    }
    .skeleton .line { height: 12px; margin-top: 12px; border-radius: 4px; }
    .skeleton .line.compact { width: 62%; }
    .skeleton .avatar { width: 36px; height: 36px; border-radius: 50%; }
    @keyframes shine { to { background-position: -200% 0; } }

    .empty {
      display: grid;
      place-items: center;
      min-height: 320px;
      padding: 30px;
      color: var(--muted);
      text-align: center;
    }
    .empty .icon { margin: 0 auto 12px; color: #a3a3a3; }
    .empty h2 { margin: 0 0 5px; color: var(--text); font-size: 18px; }
    .empty p { max-width: 420px; margin: 0; }
    .retry-button {
      height: 38px;
      margin-top: 18px;
      padding: 0 18px;
      color: white;
      background: var(--text);
      border: 0;
      border-radius: 20px;
      cursor: pointer;
    }

    .watch-page { max-width: 1180px; margin: 0 auto; }
    .watch-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; }
    .player-wrap { position: relative; overflow: hidden; background: #000; border-radius: 12px; aspect-ratio: 16 / 9; }
    .player-wrap video { width: 100%; height: 100%; display: block; object-fit: contain; background: #000; }
    .player-wrap audio { display: none; }
    .player-loading {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      color: white;
      background: rgba(0, 0, 0, .64);
      transition: opacity .2s ease;
    }
    .loading-content { display: grid; justify-items: center; gap: 11px; font-size: 13px; }
    .loading-spinner {
      width: 38px;
      height: 38px;
      border: 4px solid rgba(255,255,255,.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .player-toolbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      min-height: 42px;
      color: var(--muted);
      font-size: 13px;
    }
    .quality-select {
      min-width: 112px;
      height: 34px;
      padding: 0 9px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 7px;
      cursor: pointer;
    }
    .quality-select:disabled { cursor: not-allowed; opacity: .65; }
    .watch-title { margin: 18px 0 9px; font-size: 21px; line-height: 1.35; }
    .watch-meta { display: flex; align-items: center; justify-content: space-between; gap: 15px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
    .channel-line { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .channel-line strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .channel-line small { color: var(--muted); }
    .watch-actions { display: flex; gap: 8px; }
    .pill-button {
      height: 38px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
      border: 0;
      border-radius: 20px;
      background: var(--surface-2);
      cursor: pointer;
      white-space: nowrap;
    }
    .pill-button:hover { background: var(--surface-3); }
    .pill-button:disabled { cursor: wait; opacity: .6; }
    .subscribe-button {
      color: var(--on-accent);
      background: var(--accent);
      font-weight: 700;
    }
    .subscribe-button:hover { background: var(--accent-dark); }
    .subscribe-button.subscribed {
      color: var(--text);
      background: var(--surface-2);
    }
    .subscribe-button.subscribed:hover { background: var(--surface-3); }
    .description {
      max-height: 120px;
      overflow: hidden;
      margin-top: 14px;
      padding: 14px;
      white-space: pre-wrap;
      background: var(--surface-2);
      border-radius: 10px;
      font-size: 13px;
    }
    .comments-section { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line); }
    .comments-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .comments-header h2 { margin: 0; font-size: 18px; }
    .comments-status { margin: 14px 0 0; color: var(--muted); font-size: 13px; }
    .comments-list { display: grid; gap: 18px; margin-top: 16px; }
    .comment-item { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; }
    .comment-avatar { width: 40px; height: 40px; display: grid; place-items: center; overflow: hidden; border-radius: 50%; background: var(--surface-2); color: var(--muted); font-weight: 700; }
    .comment-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .comment-body { min-width: 0; }
    .comment-meta { display: flex; flex-wrap: wrap; align-items: baseline; gap: 7px; color: var(--muted); font-size: 12px; }
    .comment-meta strong { color: var(--text); font-size: 13px; }
    .comment-pinned { padding: 2px 7px; border-radius: 10px; background: var(--surface-2); font-size: 11px; }
    .comment-content { margin: 5px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; }
    .comments-more-button { margin-top: 18px; }
    .side-title { margin: 0 0 14px; font-size: 17px; }
    .side-list { display: grid; gap: 14px; }
    .side-list.playlist-side { gap: 5px; }
    .playlist-side-row {
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr);
      gap: 9px;
      width: 100%;
      padding: 6px;
      color: var(--text);
      background: transparent;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
    }
    .playlist-side-row:hover { background: var(--surface-2); }
    .playlist-side-row.active { background: color-mix(in srgb, var(--accent) 18%, var(--surface)); }
    .playlist-side-row .thumb { border-radius: 6px; }
    .playlist-side-row h3 { overflow: hidden; margin: 2px 0 3px; font-size: 12px; line-height: 1.35; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .playlist-side-row p { overflow: hidden; margin: 0; color: var(--muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .playlist-side-label { margin: -7px 0 11px; color: var(--muted); font-size: 12px; }
    .side-list .video-card { display: grid; grid-template-columns: 142px minmax(0, 1fr); gap: 10px; }
    .side-list .thumb { border-radius: 7px; }
    .side-list .card-body { display: block; padding: 0; }
    .side-list .channel-avatar, .side-list .card-meta { display: none; }
    .side-list .card-title { font-size: 13px; }
    .load-more-wrap { display: flex; justify-content: center; gap: 8px; padding: 28px 0 4px; }
    .load-more-button, .playlist-create button, .playlist-open-button {
      min-height: 40px;
      padding: 0 18px;
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 9px;
      cursor: pointer;
    }
    .load-more-button:hover, .playlist-create button:hover, .playlist-open-button:hover { background: var(--surface-3); }
    .load-more-button:disabled { cursor: wait; opacity: .6; }
    .playlist-file-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: -10px 0 22px; }
    .playlist-file-actions button, .playlist-file-actions label {
      display: inline-flex;
      align-items: center;
      min-height: 38px;
      padding: 0 14px;
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 9px;
      cursor: pointer;
    }
    .playlist-file-actions button:hover, .playlist-file-actions label:hover { background: var(--surface-3); }
    .playlist-file-actions input { display: none; }
    .channel-link { cursor: pointer; }
    .channel-link:hover { outline: 2px solid var(--accent); outline-offset: 2px; }
    .playlist-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
    }
    .playlist-card {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    .playlist-card-body { min-width: 0; flex: 1; }
    .playlist-thumbnail { width: 88px; height: 50px; flex: 0 0 auto; object-fit: cover; border-radius: 6px; background: var(--surface-3); }
    .playlist-card h3 { overflow: hidden; margin: 0 0 4px; text-overflow: ellipsis; white-space: nowrap; }
    .playlist-card p { margin: 0; color: var(--muted); font-size: 12px; }
    .playlist-card-actions { display: flex; gap: 6px; flex: 0 0 auto; }
    .playlist-delete-button, .playlist-remove-button {
      color: var(--muted);
      border: 0;
      background: transparent;
      cursor: pointer;
    }
    .playlist-delete-button:hover, .playlist-remove-button:hover { color: #dc2626; }
    .playlist-create {
      display: flex;
      gap: 8px;
      max-width: 560px;
      margin: 0 0 22px;
    }
    .playlist-create input {
      min-width: 0;
      flex: 1;
      height: 40px;
      padding: 0 12px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 9px;
    }
    .playlist-detail { display: grid; gap: 14px; }
    .playlist-video-row { position: relative; }
    .playlist-video-row .playlist-remove-button { position: absolute; top: 4px; right: 0; z-index: 1; }
    .playlist-picker-list { display: grid; gap: 8px; margin: 16px 0; }
    .playlist-picker-list button { width: 100%; padding: 11px 13px; color: var(--text); background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; text-align: left; }
    .playlist-picker-list button:hover { background: var(--surface-3); }

    .subscription-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
    }
    .subscription-card {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      padding: 14px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    .subscription-card .channel-avatar { width: 48px; height: 48px; }
    .subscription-card-body { min-width: 0; flex: 1; }
    .subscription-card h3 {
      overflow: hidden;
      margin: 0 0 3px;
      font-size: 14px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .subscription-card p { margin: 0; color: var(--muted); font-size: 12px; }
    .unsubscribe-button {
      flex: 0 0 auto;
      color: var(--muted);
      border: 0;
      background: transparent;
      cursor: pointer;
    }
    .unsubscribe-button:hover { color: var(--text); }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 40;
      max-width: calc(100vw - 30px);
      padding: 12px 18px;
      color: white;
      background: #333;
      border-radius: 7px;
      box-shadow: 0 4px 20px rgba(0,0,0,.2);
      transform: translate(-50%, 90px);
      transition: transform .2s ease;
    }
    .toast.show { transform: translate(-50%, 0); }
    .hidden { display: none !important; }

    .settings-backdrop {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(0, 0, 0, .55);
    }
    .settings-panel {
      width: min(100%, 560px);
      max-height: min(720px, calc(100vh - 36px));
      overflow-y: auto;
      padding: 24px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 20px 70px rgba(0,0,0,.28);
    }
    .settings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 20px;
    }
    .settings-header h2 { margin: 0; font-size: 20px; }
    .settings-group { padding: 17px 0; border-top: 1px solid var(--line); }
    .settings-label { display: block; margin-bottom: 8px; font-weight: 700; }
    .settings-help { margin: -2px 0 12px; color: var(--muted); font-size: 12px; }
    .settings-select, .settings-input {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: 0;
    }
    .settings-select:focus, .settings-input:focus { border-color: #3b82f6; }
    .settings-input + .settings-input { margin-top: 9px; }
    .settings-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .switch {
      width: 48px;
      height: 28px;
      position: relative;
      flex: 0 0 auto;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch-track {
      position: absolute;
      inset: 0;
      background: #a3a3a3;
      border-radius: 20px;
      cursor: pointer;
      transition: background .2s ease;
    }
    .switch-track::after {
      content: "";
      width: 22px;
      height: 22px;
      position: absolute;
      left: 3px;
      top: 3px;
      background: white;
      border-radius: 50%;
      transition: transform .2s ease;
    }
    .switch input:checked + .switch-track { background: var(--accent); }
    .switch input:checked + .switch-track::after { transform: translateX(20px); }
    .settings-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 20px; }
    .settings-button {
      min-height: 38px;
      padding: 0 16px;
      border: 0;
      border-radius: 19px;
      background: var(--surface-2);
      cursor: pointer;
    }
    .settings-button.primary { color: var(--on-accent); background: var(--accent); }
    .settings-button:hover { filter: brightness(.96); }

    @media (max-width: 980px) {
      .sidebar { width: 76px; }
      .sidebar .nav-label, .sidebar .nav-heading { display: none; }
      .sidebar .nav-item { justify-content: center; padding-inline: 0; }
      .content, .sidebar.collapsed + .content { width: calc(100% - 76px); margin-left: 76px; }
      .watch-layout { grid-template-columns: 1fr; }
      .side-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .video-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .side-list .video-card { display: block; }
      .side-list .card-body { padding-top: 7px; }
    }
    @media (max-width: 680px) {
      .topbar { gap: 8px; padding: 0 12px; }
      .topbar > .menu-button { display: none; }
      .brand { min-width: 120px; font-size: 16px; }
      .brand-sub { display: none; }
      .search-wrap { order: 3; position: absolute; top: 70px; left: 12px; right: 12px; max-width: none; }
      .top-actions { margin-left: 0; }
      .status { display: none; }
      .layout { padding-top: 126px; }
      .sidebar { display: none; }
      .content, .sidebar.collapsed + .content { width: 100%; margin-left: 0; }
      .page { padding: 16px 12px 45px; }
      .video-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 10px; }
      .card-body { display: block; padding-top: 7px; }
      .channel-avatar { display: none; }
      .card-title { font-size: 13px; }
      .card-meta { font-size: 11px; }
      .watch-title { font-size: 18px; }
      .watch-meta { align-items: flex-start; flex-direction: column; }
      .watch-actions { width: 100%; overflow-x: auto; }
      .side-list { grid-template-columns: 1fr; }
      .side-list .video-card { display: grid; grid-template-columns: 142px minmax(0, 1fr); }
      .channel-banner { height: 115px; }
      .channel-profile { align-items: flex-start; flex-wrap: wrap; padding: 14px; }
      .channel-header-avatar { width: 64px; height: 64px; margin-top: -40px; }
      .channel-profile-main h2 { font-size: 18px; }
      .channel-subscribe-button { margin-left: 82px; }
      .channel-about { padding-inline: 14px; }
      .channel-tabs { padding-inline: 14px; gap: 18px; }
      .channel-dashboard { padding-inline: 14px; }
      .channel-stat-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .channel-tools { align-items: stretch; flex-direction: column; }
      .channel-filter-input { width: 100%; }
      .channel-sort-select { width: 100%; }
    }
    @media (max-width: 390px) {
      .brand { min-width: 102px; }
      .video-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

  <header class="topbar">

      <svg class="icon"><use href="#i-menu"></use></svg>

      <span class="brand-mark"><svg class="icon"><use href="#i-play"></use></svg></span>
      <span>みかんTube</span><span style="font-size: 18px;">+</span>

    <form class="search-wrap" id="searchForm" role="search">
      <label class="sr-only" for="searchInput">検索</label>
      <input id="searchInput" class="search-input" autocomplete="off" placeholder="検索" type="search">
      <button class="search-button" type="submit" aria-label="検索">
        <svg class="icon"><use href="#i-search"></use></svg>
      </button>
      <div class="search-history-panel hidden" id="searchHistoryPanel" role="listbox" aria-label="検索履歴"></div>
    </form>
    <div class="top-actions">
      <button class="round-button" id="refreshButton" type="button" aria-label="再読み込み">
        <svg class="icon"><use href="#i-refresh"></use></svg>
      </button>
      <button class="round-button" id="settingsButton" type="button" aria-label="設定">
        <svg class="icon"><use href="#i-settings"></use></svg>
      </button>
    </div>
  </header>

  <script>
    "use strict";

    /*
     * インスタンスは画面に公開せず、リクエストごとに自動で健全性を判定します。
     * f5.si と ducks.party を先頭に含め、応答したインスタンスを次回優先します。
     */
    const INSTANCES = [
      "https://invidious.ritoge.com",
      "https://invidious.f5.si",
      "https://invidious.ducks.party",
      "https://yt.omada.cafe",
      "https://invidious.nerdvpn.de",

    ];
    const HEALTH_KEY = "mikan-tube-instance-health";
    const HISTORY_KEY = "mikan-tube-history";
    const SEARCH_HISTORY_KEY = "mikan-tube-search-history";
    const SUBSCRIPTIONS_KEY = "mikan-tube-subscriptions";
    const PLAYLISTS_KEY = "mikan-tube-playlists";
    const SETTINGS_KEY = "mikan-tube-settings";
    const TAB_PRESETS = {
      classroom: {
        title: "ホーム - Classroom",
        favicon: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTPMiIU5F8QnFLsyFCsrCeJNUtk53s79A-6xHHBAcTF9g&s=10"
      },
      search: {
        title: "社会 中部地方 - Google検索",
        favicon: "https://asset.watch.impress.co.jp/img/ktw/docs/2013/737/cont2_l.jpg"
      }
    };
    const state = {
      route: "home",
      lastPath: "trending?region=JP",
      lastItems: [],
      homeItems: [],
      homePool: [],
      homePage: 1,
      homeLoading: false,
      subscriptions: [],
      playlists: [],
      activePlaylistId: null,
      channelId: "",
      channelUrl: "",
      channelAuthor: "",
      channelData: null,
      channelContinuation: "",
      channelTab: "home",
      channelFilter: "",
      channelSort: "latest",
      currentVideo: null,
      currentStreams: [],
      currentStream: null,
      currentAudioStream: null,
      downloadStream: null,
      nextItems: [],
      watchPlaylistId: null,
      abortController: null,
      playbackGeneration: 0,
      commentsGeneration: 0,
      commentContinuation: ""
    };

    const $ = (selector) => document.querySelector(selector);
    const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[char]));
    const icon = (name, className = "icon") => `<svg class="${className}" aria-hidden="true"><use href="#i-${name}"></use></svg>`;

    function getHealthOrder() {
      try {
        const health = JSON.parse(localStorage.getItem(HEALTH_KEY) || "{}");
        return [...INSTANCES].sort((a, b) => (health[b] || 0) - (health[a] || 0));
      } catch (_) {
        return [...INSTANCES];
      }
    }

    function rememberInstance(instance) {
      try {
        const health = JSON.parse(localStorage.getItem(HEALTH_KEY) || "{}");
        health[instance] = Math.min((health[instance] || 0) + 1, 8);
        for (const key of Object.keys(health)) {
          if (key !== instance) health[key] = Math.max((health[key] || 0) - 1, 0);
        }
        localStorage.setItem(HEALTH_KEY, JSON.stringify(health));
      } catch (_) {}
    }

    function markInstanceFailed(instance) {
      try {
        const health = JSON.parse(localStorage.getItem(HEALTH_KEY) || "{}");
        health[instance] = Math.max((health[instance] || 0) - 3, -8);
        localStorage.setItem(HEALTH_KEY, JSON.stringify(health));
      } catch (_) {}
    }

    function setStatus(kind, text) {
      const status = $("#status");
      if (!status) return;
      status.className = `status ${kind || ""}`.trim();
      const statusText = $("#statusText");
      if (statusText) statusText.textContent = text;
    }

    function readSettings() {
      try {
        return { theme: "light", tabPreset: "classroom", customTitle: "", customFavicon: "", personalizedRecommendations: false, ...JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}") };
      } catch (_) {
        return { theme: "light", tabPreset: "classroom", customTitle: "", customFavicon: "", personalizedRecommendations: false };
      }
    }

    function applyTabSettings(settings) {
      const preset = TAB_PRESETS[settings.tabPreset];
      const title = settings.tabPreset === "custom" ? (settings.customTitle.trim() || TAB_PRESETS.classroom.title) : preset.title;
      const favicon = settings.tabPreset === "custom" ? (settings.customFavicon.trim() || TAB_PRESETS.classroom.favicon) : preset.favicon;
      document.title = title;
      $("#tabIcon").href = favicon;
    }

    function applySettings(settings = readSettings()) {
      document.documentElement.dataset.theme = settings.theme === "dark" ? "dark" : "light";
      $("#darkModeToggle").checked = settings.theme === "dark";
      $("#tabPreset").value = settings.tabPreset;
      $("#customTabTitle").value = settings.customTitle || "";
      $("#customFaviconUrl").value = settings.customFavicon || "";
      $("#personalizedRecommendationsToggle").checked = settings.personalizedRecommendations === true;
      applyTabSettings(settings);
      document.querySelector('meta[name="theme-color"]').setAttribute("content", settings.theme === "dark" ? "#0f0f0f" : "#ffffff");
    }

    function saveSettings() {
      const settings = {
        theme: $("#darkModeToggle").checked ? "dark" : "light",
        tabPreset: $("#tabPreset").value,
        customTitle: $("#customTabTitle").value,
        customFavicon: $("#customFaviconUrl").value,
        personalizedRecommendations: $("#personalizedRecommendationsToggle").checked
      };
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
      applySettings(settings);
      $("#settingsBackdrop").classList.add("hidden");
      showToast("設定を保存しました");
    }

    function isLive(item) {
      const title = String(item.title || "");
      const type = String(item.type || "").toLowerCase();
      const duration = Number(item.lengthSeconds ?? item.length ?? 0);
      const liveTitle = /ライブ|生配信|配信中|\blive\b|\blivestream\b/i.test(title);
      const isVideoType = !type || type === "video";
      return !isVideoType
        || item.liveNow === true || item.isLive === true || item.live === true
        || String(item.liveNow).toLowerCase() === "true"
        || type === "live" || liveTitle
        || duration === 0;
    }

    function withoutLive(items) {
      return (Array.isArray(items) ? items : []).filter((item) => !isLive(item));
    }

    function requestInstance(instance, path, parentSignal) {
      const controller = new AbortController();
      const task = { instance, cancelled: false, cancel: () => {} };
      let timedOut = false;
      const onAbort = () => controller.abort();
      const timeout = setTimeout(() => {
        timedOut = true;
        controller.abort();
      }, 4500);
      parentSignal.addEventListener("abort", onAbort, { once: true });
      task.cancel = () => {
        task.cancelled = true;
        controller.abort();
      };
      task.promise = fetch(`${instance}/api/v1/${path}`, {
        signal: controller.signal,
        headers: { "Accept": "application/json" }
      }).then(async (response) => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        if (data?.error) throw new Error(String(data.error));
        return { instance, data };
      }).catch((error) => {
        if (timedOut && !parentSignal.aborted) throw new Error("タイムアウト");
        throw error;
      }).finally(() => {
        clearTimeout(timeout);
        parentSignal.removeEventListener("abort", onAbort);
      });
      task.promise.catch((error) => {
        if (!parentSignal.aborted && !task.cancelled && error.name !== "AbortError") markInstanceFailed(instance);
      });
      return task;
    }

    async function api(path) {
      if (state.abortController) state.abortController.abort();
      state.abortController = new AbortController();
      const errors = [];
      const instances = getHealthOrder();
      setStatus("busy", "接続中");
      for (let offset = 0; offset < instances.length; offset += 4) {
        const tasks = instances.slice(offset, offset + 4)
          .map((instance) => requestInstance(instance, path, state.abortController.signal));
        try {
          const result = await Promise.any(tasks.map((task) => task.promise));
          tasks.forEach((task) => {
            if (task.instance !== result.instance) task.cancel();
          });
          rememberInstance(result.instance);
          setStatus("", "自動接続");
          return result.data;
        } catch (error) {
          if (state.abortController.signal.aborted) {
            const aborted = new Error("操作を中断しました");
            aborted.name = "AbortError";
            throw aborted;
          }
          const reasons = error.errors || [error];
          errors.push(...reasons.map((reason) => reason.message).filter(Boolean));
        }
      }
      setStatus("error", "接続できません");
      throw new Error(errors.slice(0, 4).join(" / ") || "接続先が見つかりません");
    }

    function formatCount(value) {
      const count = Number(value || 0);
      if (count >= 100000000) return `${(count / 100000000).toFixed(1)}億`;
      if (count >= 10000) return `${(count / 10000).toFixed(1)}万`;
      if (count >= 1000) return `${(count / 1000).toFixed(1)}千`;
      return count.toLocaleString("ja-JP");
    }

    function formatDuration(seconds) {
      const total = Number(seconds || 0);
      if (!total) return "";
      const h = Math.floor(total / 3600);
      const m = Math.floor((total % 3600) / 60).toString().padStart(2, "0");
      const s = Math.floor(total % 60).toString().padStart(2, "0");
      return h ? `${h}:${m}:${s}` : `${Number(m)}:${s}`;
    }

    function initials(value) {
      const text = String(value || "?").trim();
      return escapeHtml(text.slice(0, 1).toUpperCase());
    }

    function readSubscriptions() {
      try {
        const saved = JSON.parse(localStorage.getItem(SUBSCRIPTIONS_KEY) || "[]");
        return Array.isArray(saved) ? saved : [];
      } catch (_) {
        return [];
      }
    }

    function writeSubscriptions() {
      try { localStorage.setItem(SUBSCRIPTIONS_KEY, JSON.stringify(state.subscriptions)); } catch (_) {}
    }

    function subscriptionKey(channel) {
      return String(channel?.authorId || channel?.author || "").trim().toLowerCase();
    }

    function channelThumbnail(item) {
      const thumbnails = Array.isArray(item.authorThumbnails)
        ? item.authorThumbnails
        : [];
      return thumbnails.find((image) => /maxres|medium|default/i.test(String(image.quality || "")))?.url
        || thumbnails[thumbnails.length - 1]?.url
        || "";
    }

    function avatarHtml(rawItem) {
      const item = normalizeItem(rawItem);
      const fallback = `<span class="avatar-fallback">${initials(item.author)}</span>`;
      const src = channelThumbnail(item);
      if (!src) return fallback;
      return `<img src="${escapeHtml(src)}" loading="lazy" alt="${escapeHtml(item.author)}のアイコン">`;
    }

    function normalizeItem(item) {
      return {
        videoId: item.videoId || item.id || "",
        title: item.title || "タイトルなし",
        author: localizeChannelName(item.author || item.authorId || "チャンネル不明"),
        authorId: item.authorId || "",
        authorUrl: item.authorUrl || "",
        authorThumbnails: item.authorThumbnails || item.authorThumbnail || item.channelThumbnails || [],
        type: item.type || "",
        viewCount: item.viewCount || item.views || 0,
        publishedText: item.publishedText || "",
        published: item.published ?? item.publishedTimestamp ?? item.publishedAt ?? item.uploadDate ?? item.publishedDate ?? null,
        lengthSeconds: item.lengthSeconds || item.length || 0,
        videoThumbnails: item.videoThumbnails || [],
        description: item.description || item.descriptionText || item.descriptionHtml || ""
      };
    }

    function publishedAtMs(item) {
      const raw = item?.published ?? item?.publishedTimestamp ?? item?.publishedAt
        ?? item?.uploadDate ?? item?.publishedDate ?? null;
      if (raw === null || raw === undefined || raw === "") return NaN;
      const numeric = Number(raw);
      if (Number.isFinite(numeric)) return numeric < 100000000000 ? numeric * 1000 : numeric;
      return Date.parse(String(raw));
    }

    function isRecentNewsItem(item) {
      const now = Date.now();
      const publishedAt = publishedAtMs(item);
      const thirtyDays = 30 * 24 * 60 * 60 * 1000;
      return Number.isFinite(publishedAt) && publishedAt <= now && now - publishedAt <= thirtyDays;
    }

    function thumbnail(item) {
      const direct = item.videoThumbnails?.find((image) => image.quality === "medium")?.url
        || item.videoThumbnails?.[0]?.url;
      return direct || `https://i.ytimg.com/vi/${encodeURIComponent(item.videoId)}/mqdefault.jpg`;
    }

    function renderSkeleton(count = 8) {
      $("#videoGrid").innerHTML = Array.from({ length: count }, () => `
        <div class="video-card skeleton">
          <div class="thumb"></div>
          <div class="card-body">
            <div class="avatar"></div>
            <div><div class="line"></div><div class="line compact"></div></div>
          </div>
        </div>
      `).join("");
    }

    function cardHtml(rawItem, compact = false) {
      const item = normalizeItem(rawItem);
      if (!item.videoId) return "";
      return `
        <article class="video-card" data-video-id="${escapeHtml(item.videoId)}" tabindex="0" role="button" aria-label="${escapeHtml(item.title)}">
          <div class="thumb">
            <img src="${escapeHtml(thumbnail(item))}" loading="lazy" alt="" onerror="this.onerror=null;this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 160 90%22%3E%3Crect width=%22160%22 height=%2290%22 fill=%22%23d4d4d4%22/%3E%3C/svg%3E'">
            ${item.lengthSeconds ? `<span class="duration">${formatDuration(item.lengthSeconds)}</span>` : ""}
          </div>
          <div class="card-body">
            <div class="channel-avatar channel-link" data-channel-id="${escapeHtml(item.authorId)}" data-channel-url="${escapeHtml(item.authorUrl)}" data-channel-author="${escapeHtml(item.author)}" role="button" tabindex="0" aria-label="${escapeHtml(item.author)}のチャンネルを開く">${avatarHtml(item)}</div>
            <div>
              <h3 class="card-title">${escapeHtml(item.title)}</h3>
              <div class="card-meta">
                <span>${escapeHtml(item.author)}</span>
                ${item.viewCount ? `<span>${formatCount(item.viewCount)} 回視聴</span>` : ""}
                ${item.publishedText ? `<span>${escapeHtml(item.publishedText)}</span>` : ""}
              </div>
            </div>
          </div>
        </article>
      `;
    }

    function historyCardHtml(item) {
      const normalized = normalizeItem(item);
      return `
        <div class="history-row">
          ${cardHtml(normalized)}
          <button class="history-remove-button" type="button" data-remove-history="${escapeHtml(normalized.videoId)}">履歴から削除</button>
        </div>`;
    }

    function bindCards(root = document) {
      root.querySelectorAll(".channel-link[data-channel-author]").forEach((channel) => {
        const openChannelHome = (event) => {
          event.stopPropagation();
          openChannel(channel.dataset.channelId, channel.dataset.channelUrl, channel.dataset.channelAuthor);
        };
        channel.addEventListener("click", openChannelHome);
        channel.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openChannelHome(event);
          }
        });
      });
      root.querySelectorAll(".video-card[data-video-id]").forEach((card) => {
        const open = () => openVideo(card.dataset.videoId, card.closest("[data-playlist-id]")?.dataset.playlistId || "");
        card.addEventListener("click", open);
        card.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") { event.preventDefault(); open(); }
        });
      });
    }

    function showEmpty(title, message, retry = true) {
      $("#videoGrid").innerHTML = `
        <div class="empty" style="grid-column:1/-1">
          ${icon("alert", "icon large")}
          <div><h2>${escapeHtml(title)}</h2><p>${escapeHtml(message)}</p>
          ${retry ? `<button class="retry-button" id="retryButton" type="button">再試行</button>` : ""}</div>
        </div>`;
      $("#retryButton")?.addEventListener("click", () => loadHome(state.lastPath, $("#pageHeading").textContent));
    }

    function withPage(path, page) {
      const [pathname, query = ""] = path.split("?");
      const params = new URLSearchParams(query);
      params.set("page", String(page));
      return `${pathname}?${params.toString()}`;
    }

    function addHomeToPool(items) {
      const blocked = new Set([
        ...state.homeItems.map((item) => item.videoId || item.id),
        ...state.homePool.map((item) => item.videoId || item.id)
      ]);
      state.homePool.push(...uniqueVideoItems(items, blocked));
    }

    function renderHomeItems() {
      $("#videoGrid").className = "video-grid";
      const items = state.route === "channel" ? channelItemsForView() : state.homeItems;
      $("#videoGrid").innerHTML = items.length
        ? items.map((item) => cardHtml(item)).join("")
        : `<div class="empty" style="grid-column:1/-1">${icon("alert", "icon large")}<div><h2>動画が見つかりません</h2><p>${state.channelFilter ? "検索条件を変えてお試しください。" : "別の検索語をお試しください。"}</p></div></div>`;
      bindCards($("#videoGrid"));
      if (state.route === "channel") renderChannelDashboard();
      const hasMore = state.route !== "channel" || Boolean(state.channelContinuation) || state.homePool.length > 0;
      $("#loadMoreWrap").classList.toggle("hidden", !hasMore);
      $("#loadMoreButton").disabled = false;
      $("#loadMoreButton").textContent = "さらに読み込む";
      const canLoadAll = state.route === "channel"
        && state.channelTab !== "playlists"
        && (Boolean(state.channelContinuation) || state.homePool.length > 0);
      $("#loadAllButton").classList.toggle("hidden", !canLoadAll);
      $("#loadAllButton").disabled = false;
      $("#loadAllButton").textContent = "チャンネル動画をすべて読み込む";
    }

    async function fetchMoreHomePage() {
      if (state.route === "channel") {
        if (!state.channelId || !state.channelContinuation) return false;
        const path = channelTabPath(state.channelId, state.channelTab, state.channelContinuation);
        const data = await api(path);
        const items = Array.isArray(data) ? data : (data.videos || data.latestVideos || data.items || []);
        const before = state.homePool.length;
        addHomeToPool(channelItemsForTab(items, state.channelTab));
        state.channelContinuation = data.continuation || "";
        return state.homePool.length > before;
      }
      const page = state.homePage + 1;
      let data = await api(withPage(state.lastPath, page));
      let items = Array.isArray(data) ? data : (data.videos || data.items || []);
      const before = state.homePool.length;
      addHomeToPool(state.route === "news"
        ? uniqueVideoItems(items.filter(isRecentNewsItem))
        : withoutLive(items));
      if (state.homePool.length === before && state.lastPath.startsWith("trending")) {
        data = await api(`search?q=${encodeURIComponent("おすすめ")}&type=video&page=${page}`);
        items = Array.isArray(data) ? data : (data.videos || data.items || []);
        addHomeToPool(withoutLive(items));
      }
      state.homePage = page;
      return state.homePool.length > before;
    }

    async function loadMoreHome() {
      if (!["home", "news", "channel"].includes(state.route) || state.homeLoading) return;
      state.homeLoading = true;
      $("#loadMoreButton").disabled = true;
      $("#loadMoreButton").textContent = "読み込み中…";
      try {
        if (state.homePool.length < 20) await fetchMoreHomePage();
        const batch = state.homePool.splice(0, 20);
        if (!batch.length) {
          $("#loadMoreWrap").classList.add("hidden");
          return;
        }
        state.homeItems.push(...batch);
        renderHomeItems();
      } catch (_) {
        showToast("追加の動画を取得できませんでした");
        $("#loadMoreButton").disabled = false;
        $("#loadMoreButton").textContent = "再試行";
      } finally {
        state.homeLoading = false;
      }
    }

    async function loadAllChannelVideos() {
      if (state.route !== "channel" || state.channelTab === "playlists" || state.homeLoading) return;
      state.homeLoading = true;
      $("#loadMoreButton").disabled = true;
      $("#loadAllButton").disabled = true;
      $("#loadAllButton").textContent = "すべて読み込み中…";
      const seenContinuations = new Set();
      let pages = 0;
      try {
        while (state.channelContinuation && !seenContinuations.has(state.channelContinuation)) {
          seenContinuations.add(state.channelContinuation);
          await fetchMoreHomePage();
          pages += 1;
          if (pages % 5 === 0) {
            $("#loadAllButton").textContent = `${pages}ページ読み込み中…`;
          }
        }
        if (state.homePool.length) {
          state.homeItems.push(...state.homePool.splice(0));
        }
        renderHomeItems();
        showToast(`チャンネル動画を${state.homeItems.length.toLocaleString("ja-JP")}本読み込みました`);
      } catch (error) {
        if (error.name !== "AbortError") showToast("チャンネル動画の全件取得に失敗しました");
      } finally {
        state.homeLoading = false;
        $("#loadMoreButton").disabled = false;
        $("#loadAllButton").disabled = false;
      }
    }

    function channelItemsForView() {
      let items = [...state.homeItems];
      const filter = state.channelFilter.trim().toLowerCase();
      if (filter) {
        items = items.filter((item) => {
          const normalized = normalizeItem(item);
          return [normalized.title, normalized.author, normalized.description]
            .some((value) => String(value || "").toLowerCase().includes(filter));
        });
      }
      if (state.channelSort === "popular") {
        items.sort((a, b) => Number(b.viewCount || b.views || 0) - Number(a.viewCount || a.views || 0));
      }
      return items;
    }

      const subscribers = data.subCount ?? data.subscriberCount ?? data.subscribers;

    async function loadHome(path = "trending?region=JP", heading = "おすすめの動画", hash = null, newsMode = false) {
      stopPlayback();
      state.route = newsMode ? "news" : "home";
      $("#clearHistoryButton").classList.add("hidden");
      state.watchPlaylistId = null;
      state.channelData = null;
      $("#channelHeader").classList.add("hidden");
      $("#channelDashboard").classList.add("hidden");
      $("#chips").classList.remove("hidden");
      state.lastPath = path;
      state.homePage = 1;
      state.homeItems = [];
      state.homePool = [];
      state.homeLoading = false;
      $("#homePage").classList.remove("hidden");
      $("#watchPage").classList.add("hidden");
      $("#playlistPage").classList.add("hidden");
      $("#messagePage").classList.add("hidden");
      $("#pageHeading").textContent = heading;
      $("#pageSubheading").textContent = "";
      $("#videoGrid").className = "video-grid";
      renderSkeleton(20);
      try {
        const data = await api(path);
        let items = Array.isArray(data) ? data : (data.videos || data.items || []);
        let loadedPage = 1;
        if (newsMode) {
          let recentItems = uniqueVideoItems(items.filter(isRecentNewsItem));
          for (let page = 2; page <= 4 && recentItems.length < 20; page += 1) {
            try {
              const nextData = await api(withPage(path, page));
              const nextItems = Array.isArray(nextData) ? nextData : (nextData.videos || nextData.items || []);
              recentItems = uniqueVideoItems([...recentItems, ...nextItems.filter(isRecentNewsItem)]);
              loadedPage = page;
            } catch (error) {
              if (error.name === "AbortError") throw error;
              break;
            }
          }
          state.lastItems = recentItems;
          state.homePage = loadedPage;
          $("#pageSubheading").textContent = "投稿日時が直近30日以内の動画のみ表示";
        } else {
          state.lastItems = uniqueVideoItems(items);
        }
        if (!newsMode && !state.lastItems.length && path.startsWith("trending")) {
          try {
            const fallback = await api("search?q=%E9%9F%B3%E6%A5%BD&type=video&region=JP");
            const fallbackItems = Array.isArray(fallback) ? fallback : (fallback.videos || fallback.items || []);
            state.lastItems = uniqueVideoItems(fallbackItems);
          } catch (_) {}
        }
        const settings = readSettings();
        if (path.startsWith("trending")) {
          state.lastItems = await addNamedRecommendations(state.lastItems);
          if (settings.personalizedRecommendations && (readHistory().length || readSearchHistory().length)) {
            const recommendations = await personalizedItems(state.lastItems);
            const queries = personalizedItems.lastQueries || [];
            if (recommendations.length) {
              state.lastItems = recommendations;
              $("#pageHeading").textContent = "おすすめ＋";
              $("#pageSubheading").textContent = queries.length
                ? `履歴に関連する未視聴動画を${queries.length}種類の検索語から表示`
                : "視聴・検索履歴をもとにした未視聴動画";
            }
          }
        }
        state.homeItems = state.lastItems.slice(0, 20);
        state.homePool = state.lastItems.slice(20);
        renderHomeItems();
        history.replaceState(null, "", hash || (path === "trending?region=JP" ? "#home" : `#search=${encodeURIComponent(heading)}`));
      } catch (error) {
        if (error.name === "AbortError") return;
        showEmpty("動画を取得できません", "接続先を自動で切り替えましたが、現在応答するインスタンスがありません。");
      }
    }

    function loadNews() {
      return loadHome("search?q=%E3%83%8B%E3%83%A5%E3%83%BC%E3%82%B9&type=video&region=JP", "ニュース", "#news", true);

    function readSearchHistory() {
      try {
        const saved = JSON.parse(localStorage.getItem(SEARCH_HISTORY_KEY) || "[]");
        return Array.isArray(saved)
          ? saved.map((entry) => typeof entry === "string" ? entry : entry?.term).filter(Boolean).slice(0, 20)
          : [];
      } catch (_) {
        return [];
      }
    }

    function writeSearchHistory(items) {
      try { localStorage.setItem(SEARCH_HISTORY_KEY, JSON.stringify(items.slice(0, 20))); } catch (_) {}
    }

    function saveSearchTerm(query) {
      const value = String(query || "").trim();
      if (!value) return;
      writeSearchHistory([value, ...readSearchHistory().filter((term) => term.toLowerCase() !== value.toLowerCase())]);
    }

    function hideSearchHistory() {
      $("#searchHistoryPanel").classList.add("hidden");
    }

      const panel = $("#searchHistoryPanel");
      const value = String(filter || "").trim().toLowerCase();
      const terms = readSearchHistory().filter((term) => !value || term.toLowerCase().includes(value));
      panel.innerHTML = `

        </div>
        <div class="search-history-list">
          ${terms.length
            ? terms.map((term) => `
              <div class="search-history-row" role="option">

                  ${icon("history", "icon small")}<span>${escapeHtml(term)}</span>
                </button>

              </div>`).join("")
            : `<div class="search-history-row"><span class="search-history-term">${icon("history", "icon small")}<span>検索履歴はありません</span></span></div>`}

      panel.querySelectorAll("[data-search-term]").forEach((button) => {

    const RECOMMENDATION_STOP_WORDS = new Set([
      "動画", "公式", "チャンネル", "日本", "見る", "見て", "紹介", "まとめ", "最新",
      "完全", "無料", "ライブ", "shorts", "youtube", "youtu", "さん", "これ", "それ",
      "ため", "よう", "こと", "もの", "する", "なる", "できる", "について"
    ]);
    function recommendationTokens(text) {
      const plain = String(text || "")
        .replace(/<[^>]*>/g, " ")
        .replace(/https?:\/\/\S+/g, " ");
      const matches = plain.match(/[一-龯々]{2,}|[ぁ-んァ-ヶー]{3,}|[A-Za-z][A-Za-z0-9_-]{2,}/g) || [];
      return matches
        .map((token) => token.trim().toLowerCase())
        .filter((token) => token.length >= 2 && !RECOMMENDATION_STOP_WORDS.has(token) && !/^\d+$/.test(token));
    }

    function recommendationQueries() {
      const scores = new Map();
      const addTokens = (text, weight) => {
        for (const token of recommendationTokens(text)) {
          scores.set(token, (scores.get(token) || 0) + weight);
        }
      };
      const titlePhrases = readHistory().slice(0, 8).map((item, index) => {
        const weight = Math.max(1, 13 - index);
        const titleTokens = recommendationTokens(item.title);
        const descriptionTokens = recommendationTokens(item.description);
        addTokens(item.title, weight * 5);
        addTokens(item.description, weight);
        addTokens(item.author, weight * 2);
        return [...new Set([...titleTokens.slice(0, 2), ...descriptionTokens.slice(0, 1)])].join(" ");
      }).filter((query) => query.length >= 2);
      readSearchHistory().slice(0, 8).forEach((term) => addTokens(term, 8));
      const rankedTokens = [...scores.entries()]
        .sort((a, b) => b[1] - a[1])
        .map(([token]) => token)
        .slice(0, 8);
      return [...new Set([...titlePhrases, ...rankedTokens])]
        .filter((query) => query.trim().length >= 2)
        .slice(0, 4);
    }

    async function searchRecommendationVideos(query) {
      const data = await api(`search?q=${encodeURIComponent(query)}&type=video&region=JP`);
      const result = Array.isArray(data) ? data : (data.videos || data.items || []);
      return withoutLive(result);
    }

    async function personalizedItems(seedItems = []) {
      const queries = recommendationQueries();
      const historyVideoIds = new Set(readHistory().map((item) => item.videoId));
      const historyItems = [];
      for (const query of queries) {
        try {
          historyItems.push(...(await searchRecommendationVideos(query)).filter((item) => !historyVideoIds.has(item.videoId)));
        } catch (_) {}
      }
      personalizedItems.lastQueries = queries;
      const unseen = uniqueVideoItems([...historyItems, ...seedItems], historyVideoIds);
      return diversifyRecommendations(unseen);
    }

    function diversifyRecommendations(items) {
      const channels = new Map();
      for (const item of uniqueVideoItems(items)) {
        const normalized = normalizeItem(item);
        const channelKey = String(normalized.authorId || normalized.author || normalized.videoId).trim().toLowerCase();
        if (!channels.has(channelKey)) channels.set(channelKey, []);
        channels.get(channelKey).push(item);
      }
      const diversified = [];
      const queues = [...channels.values()];
      const rounds = Math.max(0, ...queues.map((queue) => queue.length));
      for (let round = 0; round < rounds; round += 1) {
        for (const queue of queues) {
          if (queue[round]) diversified.push(queue[round]);
        }
      }
      return diversified;
    }

    function isHikakinVideo(item) {
      const normalized = normalizeItem(item);
      return /ヒカキン|hikakin/i.test(`${normalized.author} ${normalized.title}`);
    }

    function isNamedRecommendation(item, matcher) {
      const normalized = normalizeItem(item);
      return matcher.test(`${normalized.author} ${normalized.title}`);
    }

    async function addNamedRecommendations(seedItems = []) {
      const groups = [
        { query: "ヒカキン", count: 4, matcher: /ヒカキン|hikakin/i },
        { query: "佐倉あましん", count: 3, matcher: /佐倉あましん|sakura.?amashin/i },
        { query: "ネオチューバー", count: 4, matcher: /ネオチューバー|neo.?tuber/i }
      ];
      const fetched = [];
      for (const group of groups) {
        try {
          fetched.push(uniqueVideoItems(await searchRecommendationVideos(group.query)).slice(0, group.count));
        } catch (_) {
          fetched.push([]);
        }
      }
      const regular = uniqueVideoItems(seedItems).filter(
        (item) => !groups.some((group) => isNamedRecommendation(item, group.matcher))
      );
      const extras = [];
      let groupIndex = 0;
      while (fetched.some((items) => items.length)) {
        const items = fetched[groupIndex % fetched.length];
        if (items.length) extras.push(items.shift());
        groupIndex += 1;
      }
      const mixed = [];
      let extraIndex = 0;
      regular.forEach((item, index) => {
        mixed.push(item);
        const target = Math.round((extraIndex + 1) * regular.length / (extras.length + 1));
        while (extraIndex < extras.length && index + 1 >= target) {
          mixed.push(extras[extraIndex++]);
        }
      });
      mixed.push(...extras.slice(extraIndex));
      return uniqueVideoItems(mixed);
    }

    async function search(query) {
      const value = query.trim();
      if (!value) return loadHome();
      const videoId = parseVideoId(value);
      if (videoId) return openVideo(videoId);
      saveSearchTerm(value);
      document.querySelectorAll("#chips .chip").forEach((chip) => chip.classList.toggle("active", chip.dataset.query === value));
      await loadHome(`search?q=${encodeURIComponent(value)}&type=video&region=JP`, `「${value}」の検索結果`, `#search=${encodeURIComponent(value)}`);
    }

    function channelIdFrom(id, url) {
      if (id) return String(id);
      return String(url || "").match(/\/channel\/([^/?#]+)/i)?.[1] || "";
    }

    function channelBanner(item) {
      const banners = item?.authorBanners || item?.authorBanner || item?.banners || [];
      if (Array.isArray(banners)) return banners[0]?.url || banners[0] || "";
      return typeof banners === "string" ? banners : banners?.url || "";
    }

    function localizeChannelName(value) {
      const name = String(value || "").trim();
      const aliases = {
        "rocket reimu (jp)": "ロケット霊夢",
        "rocket reimu": "ロケット霊夢"
      };
      return aliases[name.toLowerCase()] || name;
    }

    function localizeChannelDescription(value) {
      let text = stripHtml(value || "").replace(/\r\n/g, "\n").trim();
      const translations = [
        [/This description is only shown to users whose YouTube language is set to English\.\s*/gi, ""],
        [/This video is entirely fictional\. Any resemblance to actual persons, organizations, companies, or events is purely coincidental\./gi, "この動画は完全なフィクションです。実在の人物、団体、企業、出来事などに似ている場合も、すべて偶然の一致です。"],
        [/\[PC SPECS\]/gi, "[PCスペック]"],
        [/\[Business Inquiries\]/gi, "[仕事の依頼について]"],
        [/Please note that I am not accepting any business proposals, sponsorships, promotional offers, or sales inquiries for this channel or any related social media accounts/gi, "このチャンネルおよび関連するSNSアカウントでは、業務提案、スポンサー、宣伝、営業などのご連絡は受け付けていません"],
        [/This description was written and translated with the assistance of ChatGPT\./gi, "この概要欄はChatGPTの協力を得て作成・翻訳されています。"]
      ];
      translations.forEach(([pattern, replacement]) => { text = text.replace(pattern, replacement); });
      return text.replace(/\n{3,}/g, "\n\n").trim();
    }

    const CHANNEL_TABS = {
      home: { label: "ホーム", filter: "" },
      videos: { label: "動画", filter: "videos" },
      shorts: { label: "ショート", filter: "shorts" },
      live: { label: "ライブ", filter: "livestreams" },
      playlists: { label: "再生リスト", filter: "" }
    };

    function channelTabPath(channelId, tab = "home", continuation = "") {
      const config = CHANNEL_TABS[tab] || CHANNEL_TABS.home;
      const params = new URLSearchParams({ hl: "ja" });
      if (config.filter) params.set("filter", config.filter);
      if (continuation) params.set("continuation", continuation);
      return `channels/${encodeURIComponent(channelId)}?${params.toString()}`;
    }

        button.setAttribute("aria-selected", String(active));

    function channelPlaylistHtml(playlist) {

      const title = playlist.title || playlist.name || "再生リスト";

        || "";

        <a class="playlist-card" href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer">

    async function openChannel(id, url = "", author = "チャンネル", tab = "home") {
      const channelId = channelIdFrom(id, url);
      if (!channelId) return showToast("このチャンネルのホームを取得できません");
      stopPlayback();

    function parseVideoId(value) {
      try {
        const url = new URL(value);
        if (!/(youtube\.com|youtu\.be)$/i.test(url.hostname.replace(/^www\./, ""))) return "";
        if (url.hostname.includes("youtu.be")) return url.pathname.slice(1).split("/")[0];
        return url.searchParams.get("v") || "";
      } catch (_) {
        return /^[A-Za-z0-9_-]{11}$/.test(value) ? value : "";
      }
    }

    function readHistory() {
      try {
        const saved = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
        return Array.isArray(saved) ? saved.filter((item) => item && item.videoId) : [];
      } catch (_) {
        return [];
      }
    }

    function writeHistory(items) {
      try { localStorage.setItem(HISTORY_KEY, JSON.stringify(items.slice(0, 30))); } catch (_) {}
    }

    function saveHistory(item) {
      if (!item?.videoId) return;
      writeHistory([item, ...readHistory().filter((entry) => entry.videoId !== item.videoId)]);
    }

    function removeHistoryItem(videoId) {
      writeHistory(readHistory().filter((item) => item.videoId !== videoId));
      loadHistory();
      showToast("履歴から削除しました");
    }

    function clearHistory() {
      if (!readHistory().length) return;
      if (!confirm("視聴履歴をすべて削除しますか？")) return;
      writeHistory([]);
      loadHistory();
      showToast("視聴履歴をすべて削除しました");
    }

    function readPlaylists() {
      try {
        const saved = JSON.parse(localStorage.getItem(PLAYLISTS_KEY) || "[]");
        return Array.isArray(saved) ? saved.filter((list) => list && list.id && list.name) : [];
      } catch (_) {
        return [];
      }
    }

    function writePlaylists() {
      try { localStorage.setItem(PLAYLISTS_KEY, JSON.stringify(state.playlists)); } catch (_) {}
    }

    function exportPlaylists() {
      const payload = {
        format: "mikanTube-playlists",
        version: 1,
        exportedAt: new Date().toISOString(),
        playlists: state.playlists
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `mikanTube-playlists-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showToast("再生リストを書き出しました");
    }

    async function importPlaylists(file) {
      if (!file) return;
      try {
        const parsed = JSON.parse(await file.text());
        const source = Array.isArray(parsed) ? parsed : parsed.playlists;
        if (!Array.isArray(source)) throw new Error("再生リスト形式ではありません");
        const imported = source.map((entry) => {
          const items = Array.isArray(entry?.items)
            ? entry.items.map(normalizeItem).filter((item) => item.videoId)
            : [];
          return {
            id: playlistId(),
            name: String(entry?.name || "インポートした再生リスト").trim().slice(0, 80) || "インポートした再生リスト",
            items: items.filter((item, index, all) => all.findIndex((candidate) => candidate.videoId === item.videoId) === index),
            createdAt: Date.now()
          };
        }).filter((entry) => entry.name);
        if (!imported.length) throw new Error("読み込める再生リストがありません");
        state.playlists = [...imported, ...state.playlists];
        writePlaylists();
        renderPlaylistCards();
        showToast(`${imported.length}件の再生リストを読み込みました`);
      } catch (error) {
        showToast(error.message || "インポートに失敗しました");
      } finally {
        $("#importPlaylistsInput").value = "";
      }
    }

    function playlistId() {
      return `playlist-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;

    function createPlaylist(name, item = null) {
      const value = String(name || "").trim();
      if (!value) return null;
      const list = { id: playlistId(), name: value, items: item?.videoId ? [item] : [], createdAt: Date.now() };
      state.playlists.unshift(list);
      writePlaylists();
      return list;
    }

      if (!list || !item?.videoId) return false;

    function stopPlayback() {

    function setPlayerLoading(isLoading, message = "動画を読み込み中…") {

    function streamQuality(stream) {
      const values = [
        stream.qualityLabel,
        stream.resolution,
        stream.quality,
        stream.size
      ].map((value) => String(value || ""));
      const value = values.find((entry) => /(?:\d{3,4}p|\d{3,5}x\d{3,4})/i.test(entry))
        || values.find(Boolean)
        || "";
      const match = value.match(/(\d{3,4})p/i);
      const dimensionMatch = value.match(/\d{3,5}x(\d{3,4})/i);
      return match ? `${match[1]}p` : dimensionMatch ? `${dimensionMatch[1]}p` : (value || "標準");
    }

    function qualityNumber(stream) {
      return Number(streamQuality(stream).match(/\d+/)?.[0] || 0);
    }

    function getQualityStreams(video) {
      const probe = document.createElement("video");
      const supports = (stream) => {
        const type = String(stream.type || "").trim();
        return !type || !probe.canPlayType(type) ? !type : true;
      };
      const progressive = (video.formatStreams || [])
        .filter((stream) => {
          const type = String(stream.type || "").toLowerCase();
          return stream.url && (!type || type.includes("video/"));
        })
        .map((stream) => ({ ...stream, _progressive: true }));
      const adaptive = (video.adaptiveFormats || [])
        .filter((stream) => {
          const type = String(stream.type || "").toLowerCase();
          return stream.url && type.includes("video/") && !type.includes("audio/");
        })
        .map((stream) => ({ ...stream, _progressive: false }));
      const streams = [...progressive, ...adaptive]
        .sort((a, b) => Number(supports(b)) - Number(supports(a))
          || qualityNumber(b) - qualityNumber(a)
          || Number(b._progressive) - Number(a._progressive)
          || (Number(b.bitrate) || 0) - (Number(a.bitrate) || 0));
      const seen = new Set();
      return streams.filter((stream) => {
        const quality = streamQuality(stream);
        if (seen.has(quality)) return false;
        seen.add(quality);
        return true;
      });
    }

    function getAudioStream(video) {
      return (video.adaptiveFormats || [])
        .filter((stream) => {
          const type = String(stream.type || "").toLowerCase();
          return stream.url && type.includes("audio/");
        })
        .sort((a, b) => {
          const supported = (stream) => /audio\/(mp4|webm|ogg)/i.test(String(stream.type || ""));
          return Number(supported(b)) - Number(supported(a))
            || (Number(b.bitrate) || 0) - (Number(a.bitrate) || 0);
        })[0] || null;
    }

    function getDownloadStream(streams) {
      const candidates = (Array.isArray(streams) ? streams : [])
        .filter((stream) => {
          if (!stream?._progressive || !stream.url) return false;
          const type = String(stream.type || "").toLowerCase();
          const container = String(stream.container || "").toLowerCase();
          return /video\/(mp4|webm)/i.test(type) || /^(mp4|webm|webp)$/i.test(container);
        })
        .sort((a, b) => {
          const typeScore = (stream) => /mp4/i.test(String(stream.type || stream.container || "")) ? 2 : 1;
          const targetQuality = (stream) => {
            const quality = qualityNumber(stream);
            return quality > 0 && quality <= 720 ? quality : 0;
          };
          return typeScore(b) - typeScore(a)
            || targetQuality(b) - targetQuality(a)
            || qualityNumber(b) - qualityNumber(a)
            || (Number(b.bitrate) || 0) - (Number(a.bitrate) || 0);
        });
      return candidates[0] || null;
    }

    function renderQualityOptions(streams, selectedStream) {
      const select = $("#qualitySelect");
      select.innerHTML = streams.length
        ? streams.map((stream, index) => {
          const suffix = stream._progressive
            ? "（音声付き）"
            : "（映像のみ）";
          return `<option value="${index}">${escapeHtml(streamQuality(stream))}${suffix}${stream.container ? ` (${escapeHtml(stream.container.toUpperCase())})` : ""}</option>`;
        }).join("")
        : "<option>画質情報なし</option>";
      select.disabled = streams.length < 2;
      const selectedIndex = streams.indexOf(selectedStream);
      if (selectedIndex >= 0) select.value = String(selectedIndex);
    }

    function syncAudioToVideo() {
      const player = $("#player");
      const audio = $("#audioPlayer");
      if (!audio.src || !Number.isFinite(player.currentTime) || audio.readyState < HTMLMediaElement.HAVE_METADATA) return;
      const drift = player.currentTime - audio.currentTime;
      const baseRate = player.playbackRate || 1;
      if (!Number.isFinite(drift)) return;
      if (Math.abs(drift) > 0.9) {
        try { audio.currentTime = player.currentTime; } catch (_) {}
      }
      audio.playbackRate = !player.paused && Math.abs(drift) > 0.04
        ? baseRate * Math.min(1.04, Math.max(0.96, 1 + drift * 0.08))
        : baseRate;
    }

    function setPlayerStream(stream, preservePosition = false) {
      const player = $("#player");
      const audio = $("#audioPlayer");
      const generation = ++state.playbackGeneration;
      const wasPlaying = !player.paused && !player.ended;
      const currentTime = preservePosition ? player.currentTime : 0;
      state.currentStream = stream;
      setPlayerLoading(true, preservePosition ? "画質を切り替え中…" : "動画を読み込み中…");
      if (stream._progressive || !state.currentAudioStream) {
        audio.pause();
        audio.removeAttribute("src");
        audio.load();
      } else {
        audio.src = state.currentAudioStream.url;
        audio.load();
        audio.volume = player.volume;
        audio.muted = player.muted;
        audio.playbackRate = player.playbackRate;
      }
      player.addEventListener("loadedmetadata", () => {
        if (generation !== state.playbackGeneration || state.currentStream !== stream) return;
        if (preservePosition && Number.isFinite(currentTime)) {
          player.currentTime = Math.min(currentTime, Number.isFinite(player.duration) ? player.duration : currentTime);
        }
        syncAudioToVideo();
        if (wasPlaying) player.play().catch(() => {});
      }, { once: true });
      player.src = stream.url;
      player.load();
    }

    function uniqueVideoItems(items, blockedIds = new Set(), includeLive = false) {
      const seen = new Set(blockedIds);
      return (Array.isArray(items) ? items : []).filter((item) => {
        const id = item.videoId || item.id || "";
        if (!id || seen.has(id) || (!includeLive && isLive(item))) return false;
        seen.add(id);
        return true;
      });
    }
