    async function downloadCurrentVideo() {
      const button = $("#downloadButton");
      const stream = state.downloadStream;
      if (!stream?.url) return showToast("音声付きMP4/WEBMを取得できませんでした");
      const title = String(state.currentVideo?.title || "mikanTube-video")
        .replace(/[\\/:*?"<>|]/g, "_")
        .trim()
        .slice(0, 80) || "mikanTube-video";
      const streamFormat = String(stream.container || stream.type || "").toLowerCase();
      const extension = streamFormat.includes("webp") ? "webp" : streamFormat.includes("webm") ? "webm" : "mp4";
      button.disabled = true;
      button.querySelector("span").textContent = "準備中…";
      try {
        const response = await fetch(stream.url, { mode: "cors" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const blob = await response.blob();
        const objectUrl = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = objectUrl;
        link.download = `${title}.${extension}`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
        showToast(`${streamQuality(stream)}の音声付き${extension.toUpperCase()}を保存しました`);
      } catch (_) {
        const link = document.createElement("a");
        link.href = stream.url;
        link.download = `${title}.${extension}`;
        link.rel = "noopener noreferrer";
        document.body.appendChild(link);
        link.click();
        link.remove();
        showToast("音声付きファイルのダウンロードを開始しました");
      } finally {
        button.disabled = false;
        button.querySelector("span").textContent = "音声付きDL";
      }
    }

    function renderComment(comment) {
      const author = String(comment?.author || "匿名");
      const thumbnails = Array.isArray(comment?.authorThumbnails) ? comment.authorThumbnails : [];
      const avatarCandidate = thumbnails.find((image) => image?.url)?.url || "";
      const avatarUrl = /^https:/i.test(avatarCandidate) ? avatarCandidate : "";
      const content = stripHtml(comment?.contentHtml || comment?.content || "");
      const meta = [
        comment?.publishedText,
        Number(comment?.likeCount) > 0 ? "👍 " + formatCount(comment.likeCount) : "",
        Number(comment?.replyCount) > 0 ? "返信 " + formatCount(comment.replyCount) + "件" : ""
      ].filter(Boolean).map(escapeHtml).join(" · ");
      const avatar = avatarUrl
        ? '<img src="' + escapeHtml(avatarUrl) + '" loading="lazy" referrerpolicy="no-referrer" alt="">'
        : escapeHtml(author.slice(0, 1) || "?");
      const pinned = comment?.isPinned ? '<span class="comment-pinned">固定コメント</span>' : "";
      return '<article class="comment-item"><div class="comment-avatar">' + avatar + '</div><div class="comment-body"><div class="comment-meta"><strong>' + escapeHtml(author) + '</strong>' + (meta ? '<span>' + meta + '</span>' : "") + pinned + '</div><p class="comment-content">' + escapeHtml(content) + '</p></div></article>';
    }

    async function loadComments(videoId, continuation = "", append = false) {
      const requestId = ++state.commentsGeneration;
      const list = $("#commentsList");
      const status = $("#commentsStatus");
      const button = $("#commentsMoreButton");
      if (!append) {
        state.commentContinuation = "";
        list.innerHTML = "";
        status.textContent = "コメントを読み込み中…";
        status.hidden = false;
        button.classList.add("hidden");
      }
      button.disabled = true;
      button.textContent = "読み込み中…";
      try {
        const query = continuation ? "?continuation=" + encodeURIComponent(continuation) : "";
        const data = await api("comments/" + encodeURIComponent(videoId) + query);
        if (requestId !== state.commentsGeneration || state.route !== "watch" || state.currentVideo?.videoId !== videoId) return;
        const comments = Array.isArray(data) ? data : (Array.isArray(data?.comments) ? data.comments : []);
        const nextContinuation = typeof data?.continuation === "string" ? data.continuation : "";
        if (comments.length) list.insertAdjacentHTML("beforeend", comments.map(renderComment).join(""));
        state.commentContinuation = nextContinuation;
        status.textContent = comments.length || append ? "" : "この動画にはコメントがありません。";
        status.hidden = Boolean(comments.length || append);
        button.classList.toggle("hidden", !nextContinuation);
        button.textContent = "さらにコメントを読み込む";
      } catch (error) {
        if (error.name === "AbortError" || requestId !== state.commentsGeneration) return;
        status.textContent = append ? "追加のコメントを取得できませんでした。" : "コメントを取得できませんでした。";
        status.hidden = false;
        button.classList.toggle("hidden", !append || !state.commentContinuation);
        button.textContent = append ? "再試行" : "さらにコメントを読み込む";
      } finally {
        if (requestId === state.commentsGeneration) button.disabled = false;
      }
    }

    async function openVideo(videoId, playlistId = "") {
      stopPlayback();
      state.route = "watch";
      state.watchPlaylistId = playlistId || null;
      $("#downloadButton").disabled = true;
      $("#homePage").classList.add("hidden");
      $("#playlistPage").classList.add("hidden");
      $("#loadMoreWrap").classList.add("hidden");
      $("#messagePage").classList.add("hidden");
      $("#watchPage").classList.remove("hidden");
      $("#watchTitle").textContent = "動画を読み込んでいます";
      $("#watchAuthor").textContent = "";
      $("#watchStats").textContent = "";
      $("#watchDescription").textContent = "";
      state.commentsGeneration += 1;
      state.commentContinuation = "";
      $("#commentsList").innerHTML = "";
      $("#commentsStatus").textContent = "コメントを読み込み中…";
      $("#commentsStatus").hidden = false;
      $("#commentsMoreButton").classList.add("hidden");
      $("#commentsMoreButton").disabled = false;
      $("#commentsMoreButton").onclick = () => {
        if (state.currentVideo?.videoId && state.commentContinuation) {
          loadComments(state.currentVideo.videoId, state.commentContinuation, true);
        }
      };
      state.currentVideo = null;
      $("#player").pause();
      $("#qualitySelect").innerHTML = "<option>読み込み中…</option>";
      $("#qualitySelect").disabled = true;
      state.currentStreams = [];
      state.currentStream = null;
      state.currentAudioStream = null;
      state.downloadStream = null;
      setPlayerLoading(true);
      $("#sideTitle").textContent = state.watchPlaylistId ? "再生リスト" : "次の動画";
      $("#nextList").className = state.watchPlaylistId ? "side-list playlist-side" : "side-list";
      $("#nextList").innerHTML = "";
      history.pushState(null, "", `#watch=${encodeURIComponent(videoId)}`);
      window.scrollTo({ top: 0, behavior: "instant" });
      try {
        const raw = await api(`videos/${encodeURIComponent(videoId)}`);
        const item = normalizeItem(raw);
        const streams = getQualityStreams(raw);
        state.currentAudioStream = getAudioStream(raw);
        state.downloadStream = getDownloadStream(streams);
        const progressive = streams.filter((candidate) => candidate._progressive);
        const stream = progressive.find((candidate) => qualityNumber(candidate) <= 720 && qualityNumber(candidate) > 0)
          || progressive[0]
          || streams.find((candidate) => qualityNumber(candidate) <= 720 && qualityNumber(candidate) > 0)
          || streams[0];
        if (!stream?.url) throw new Error("再生URLがありません");
        state.currentStreams = streams;
        state.currentVideo = item;
        saveHistory(item);
        $("#watchTitle").textContent = item.title;
        $("#watchAvatar").innerHTML = avatarHtml(item);
        $("#watchAvatar").dataset.channelId = item.authorId;
        $("#watchAvatar").dataset.channelUrl = item.authorUrl;
        $("#watchAvatar").dataset.channelAuthor = item.author;
        $("#watchAvatar").classList.add("channel-link");
        $("#watchAvatar").setAttribute("role", "button");
        $("#watchAvatar").setAttribute("tabindex", "0");
        $("#watchAvatar").setAttribute("aria-label", `${item.author}のチャンネルを開く`);
        $("#watchAuthor").textContent = item.author;
        $("#watchStats").textContent = `${formatCount(item.viewCount)} 回視聴${item.publishedText ? `・${item.publishedText}` : ""}`;
        applySubscribeButton();
        $("#watchDescription").textContent = raw.descriptionHtml ? stripHtml(raw.descriptionHtml) : (item.description || "説明はありません。");
        const player = $("#player");
        player.poster = thumbnail(item);
        renderQualityOptions(state.currentStreams, stream);
        setPlayerStream(stream);
        $("#downloadButton").disabled = !state.downloadStream;
        await prepareNextVideos(raw, videoId);
        if (state.watchPlaylistId) renderSidePanel();
        loadComments(videoId);
      } catch (error) {
        setPlayerLoading(false);
        $("#watchTitle").textContent = "動画を再生できません";
        $("#watchDescription").textContent = "この動画の再生URLを取得できませんでした。別の動画をお試しください。";
        $("#commentsStatus").textContent = "動画を取得できないため、コメントを表示できません。";
        $("#commentsStatus").hidden = false;
        showToast("動画の取得に失敗しました");
      }
    }

    function pickStream(video) {
      const streams = getQualityStreams(video);
      return streams.find((stream) => Number(stream.resolution?.replace("p", "")) <= 720) || streams[0];
    }

    function stripHtml(value) {
      const template = document.createElement("template");
      template.innerHTML = value;
      return template.content.textContent || "";
    }

    function showMessage(title, text) {
      stopPlayback();
      $("#homePage").classList.add("hidden");
      $("#watchPage").classList.add("hidden");
      $("#playlistPage").classList.add("hidden");
      $("#loadMoreWrap").classList.add("hidden");
      $("#messagePage").classList.remove("hidden");
      $("#channelHeader").classList.add("hidden");
      $("#channelDashboard").classList.add("hidden");
      $("#chips").classList.remove("hidden");
      $("#messageContent").innerHTML = `${icon("library", "icon large")}<div><h2>${escapeHtml(title)}</h2><p>${escapeHtml(text)}</p></div>`;
    }

    function applySubscribeButton() {
      const button = $("#subscribeButton");
      if (!button || !state.currentVideo) return;
      const subscribed = state.subscriptions.some((channel) => subscriptionKey(channel) === subscriptionKey(state.currentVideo));
      button.classList.toggle("subscribed", subscribed);
      button.setAttribute("aria-pressed", String(subscribed));
      button.querySelector("span").textContent = subscribed ? "登録解除" : "チャンネル登録";
    }

    function toggleSubscription() {
      if (!state.currentVideo || !subscriptionKey(state.currentVideo)) return;
      const key = subscriptionKey(state.currentVideo);
      const index = state.subscriptions.findIndex((channel) => subscriptionKey(channel) === key);
      if (index >= 0) {
        state.subscriptions.splice(index, 1);
        showToast("チャンネル登録を解除しました");
      } else {
        state.subscriptions.unshift({
          authorId: state.currentVideo.authorId,
          author: state.currentVideo.author,
          authorUrl: state.currentVideo.authorUrl,
          authorThumbnails: state.currentVideo.authorThumbnails
        });
        showToast("チャンネルを登録しました");
      }
      writeSubscriptions();
      applySubscribeButton();
    }

    function toggleChannelSubscription() {
      if (!state.channelId) return;
      const channel = {
        authorId: state.channelId,
        author: state.channelAuthor,
        authorUrl: state.channelUrl,
        authorThumbnails: state.channelData?.authorThumbnails || []
      };
      const key = subscriptionKey(channel);
      const index = state.subscriptions.findIndex((entry) => subscriptionKey(entry) === key);
      if (index >= 0) {
        state.subscriptions.splice(index, 1);
        showToast("チャンネル登録を解除しました");
      } else {
        state.subscriptions.unshift(channel);
        showToast("チャンネルを登録しました");
      }
      writeSubscriptions();
      renderChannelHeader(state.channelData || channel);
    }

    function subscriptionCardHtml(channel) {
      const key = subscriptionKey(channel);
      return `
        <article class="subscription-card">
          <div class="channel-avatar channel-link" data-channel-id="${escapeHtml(channel.authorId)}" data-channel-url="${escapeHtml(channel.authorUrl)}" data-channel-author="${escapeHtml(channel.author || "チャンネル不明")}" role="button" tabindex="0" aria-label="${escapeHtml(channel.author || "チャンネル不明")}のチャンネルを開く">${avatarHtml(channel)}</div>
          <div class="subscription-card-body">
            <h3>${escapeHtml(channel.author || "チャンネル不明")}</h3>
            <p>登録済み</p>
          </div>
          <button class="unsubscribe-button" type="button" data-subscription-key="${escapeHtml(key)}">登録解除</button>
        </article>
      `;
    }

    function loadSubscriptions() {
      stopPlayback();
      state.route = "subscriptions";
      $("#clearHistoryButton").classList.add("hidden");
      state.watchPlaylistId = null;
      state.subscriptions = readSubscriptions();
      $("#homePage").classList.remove("hidden");
      $("#watchPage").classList.add("hidden");
      $("#playlistPage").classList.add("hidden");
      $("#messagePage").classList.add("hidden");
      $("#channelHeader").classList.add("hidden");
      $("#channelDashboard").classList.add("hidden");
      $("#chips").classList.remove("hidden");
      $("#loadMoreWrap").classList.add("hidden");
      $("#pageHeading").textContent = "登録チャンネル";
      $("#pageSubheading").textContent = "このブラウザに保存されたチャンネル";
      $("#videoGrid").className = "subscription-grid";
      $("#videoGrid").innerHTML = state.subscriptions.length
        ? state.subscriptions.map(subscriptionCardHtml).join("")
        : `<div class="empty" style="grid-column:1/-1">${icon("users", "icon large")}<div><h2>登録チャンネルはありません</h2><p>動画ページの「チャンネル登録」から追加できます。</p></div></div>`;
      bindCards($("#videoGrid"));
      $("#videoGrid").querySelectorAll("[data-subscription-key]").forEach((button) => {
        button.addEventListener("click", () => {
          state.subscriptions = state.subscriptions.filter((channel) => subscriptionKey(channel) !== button.dataset.subscriptionKey);
          writeSubscriptions();
          loadSubscriptions();
          showToast("チャンネル登録を解除しました");
        });
      });
    }

    function loadHistory() {
      stopPlayback();
      state.route = "history";
      state.watchPlaylistId = null;
      const items = readHistory();
      $("#clearHistoryButton").classList.toggle("hidden", !items.length);
      if (!items.length) return showMessage("履歴はありません", "視聴した動画がここに表示されます。");
      $("#homePage").classList.remove("hidden");
      $("#watchPage").classList.add("hidden");
      $("#playlistPage").classList.add("hidden");
      $("#messagePage").classList.add("hidden");
      $("#channelHeader").classList.add("hidden");
      $("#channelDashboard").classList.add("hidden");
      $("#chips").classList.remove("hidden");
      $("#loadMoreWrap").classList.add("hidden");
      $("#pageHeading").textContent = "履歴";
      $("#pageSubheading").textContent = "このブラウザに保存された視聴履歴";
      $("#videoGrid").className = "video-grid";
      $("#videoGrid").innerHTML = items.map(historyCardHtml).join("");
      bindCards($("#videoGrid"));
      $("#videoGrid").querySelectorAll("[data-remove-history]").forEach((button) => {
        button.addEventListener("click", (event) => {
          event.stopPropagation();
          removeHistoryItem(button.dataset.removeHistory);
        });
      });
    }

    function routeFromHash() {
      const hash = location.hash;
      const watch = hash.match(/^#watch=(.+)$/);
      const searchMatch = hash.match(/^#search=(.+)$/);
      const channelMatch = hash.match(/^#channel=([^&]+)(?:&tab=([^&]+))?$/);
      if (hash === "#news") return loadNews();
      if (watch) return openVideo(decodeURIComponent(watch[1]));
      if (searchMatch) return search(decodeURIComponent(searchMatch[1]));
      if (channelMatch) return openChannel(decodeURIComponent(channelMatch[1]), "", "チャンネル", decodeURIComponent(channelMatch[2] || "home"));
      return loadHome();
    }

    function showToast(message) {
      const toast = $("#toast");
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), 2600);
    }

    $("#menuButton").addEventListener("click", () => $("#sidebar").classList.toggle("collapsed"));
    $("#watchAvatar").addEventListener("click", () => {
      const avatar = $("#watchAvatar");
      openChannel(avatar.dataset.channelId, avatar.dataset.channelUrl, avatar.dataset.channelAuthor);
    });
    $("#watchAvatar").addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        const avatar = $("#watchAvatar");
        openChannel(avatar.dataset.channelId, avatar.dataset.channelUrl, avatar.dataset.channelAuthor);
      }
    });
    $("#searchForm").addEventListener("submit", (event) => {
      event.preventDefault();
      search($("#searchInput").value);
    });
    $("#searchInput").addEventListener("focus", () => renderSearchHistory($("#searchInput").value));
    $("#searchInput").addEventListener("input", () => renderSearchHistory($("#searchInput").value));
    document.addEventListener("click", (event) => {
      if (!event.target.closest(".search-wrap")) hideSearchHistory();
    });
    $("#chips").addEventListener("click", (event) => {
      const chip = event.target.closest(".chip");
      if (!chip) return;
      $("#searchInput").value = chip.dataset.query;
      search(chip.dataset.query);
    });
    $("#loadMoreButton").addEventListener("click", loadMoreHome);
    $("#loadAllButton").addEventListener("click", loadAllChannelVideos);
    $("#channelFilterInput").addEventListener("input", (event) => {
      if (state.route !== "channel") return;
      state.channelFilter = event.target.value;
      renderHomeItems();
    });
    $("#channelSortSelect").addEventListener("change", (event) => {
      if (state.route !== "channel") return;
      state.channelSort = event.target.value === "popular" ? "popular" : "latest";
      renderHomeItems();
    });
    $("#refreshButton").addEventListener("click", () => state.route === "watch" && state.currentVideo
      ? openVideo(state.currentVideo.videoId)
      : state.route === "playlists" ? loadPlaylists()
      : state.route === "channel" ? openChannel(state.channelId, state.channelUrl, state.channelAuthor)
      : state.route === "news" ? loadNews()
      : loadHome(state.lastPath, $("#pageHeading").textContent));
    $("#backButton").addEventListener("click", () => { history.pushState(null, "", "#home"); loadHome(); });
    $("#clearHistoryButton").addEventListener("click", clearHistory);
    $("#subscribeButton").addEventListener("click", toggleSubscription);
    $("#channelSubscribeButton").addEventListener("click", toggleChannelSubscription);
    document.querySelectorAll(".channel-tab").forEach((button) => {
      button.addEventListener("click", () => {
        if (state.route !== "channel" || !state.channelId) return;
        openChannel(state.channelId, state.channelUrl, state.channelAuthor, button.dataset.channelTab);
      });
    });
    $("#addToPlaylistButton").addEventListener("click", openPlaylistPicker);
    $("#downloadButton").addEventListener("click", downloadCurrentVideo);
    $("#likeButton").addEventListener("click", () => showToast("評価はこのブラウザ内では送信されません"));
    $("#qualitySelect").addEventListener("change", (event) => {
      const stream = state.currentStreams[Number(event.target.value)];
      if (stream && stream !== state.currentStream) setPlayerStream(stream, true);
    });
    $("#player").addEventListener("loadstart", () => setPlayerLoading(true));
    $("#player").addEventListener("waiting", () => setPlayerLoading(true, "バッファリング中…"));
    $("#player").addEventListener("stalled", () => setPlayerLoading(true, "接続を待っています…"));
    $("#player").addEventListener("loadeddata", () => setPlayerLoading(false));
    $("#player").addEventListener("canplay", () => setPlayerLoading(false));
    $("#player").addEventListener("playing", () => {
      setPlayerLoading(false);
      const audio = $("#audioPlayer");
      if (audio.src) {
        syncAudioToVideo();
        audio.play().catch(() => {});
      }
    });
    $("#player").addEventListener("error", () => setPlayerLoading(false));
    $("#player").addEventListener("play", () => {
      const audio = $("#audioPlayer");
      if (!audio.src) return;
      syncAudioToVideo();
      audio.play().catch(() => {});
    });
    $("#player").addEventListener("pause", () => $("#audioPlayer").pause());
    $("#player").addEventListener("waiting", () => $("#audioPlayer").pause());
    $("#player").addEventListener("seeking", syncAudioToVideo);
    $("#player").addEventListener("seeked", syncAudioToVideo);
    $("#player").addEventListener("timeupdate", syncAudioToVideo);
    $("#player").addEventListener("ratechange", () => {
      $("#audioPlayer").playbackRate = $("#player").playbackRate;
    });
    $("#player").addEventListener("volumechange", () => {
      $("#audioPlayer").volume = $("#player").volume;
      $("#audioPlayer").muted = $("#player").muted;
    });
    $("#player").addEventListener("ended", () => {
      const audio = $("#audioPlayer");
      audio.pause();
      audio.currentTime = 0;
    });
    $("#audioPlayer").addEventListener("loadedmetadata", syncAudioToVideo);
    $("#audioPlayer").addEventListener("canplay", () => {
      syncAudioToVideo();
      if (!$("#player").paused && !$("#player").ended) $("#audioPlayer").play().catch(() => {});
    });
    $("#settingsButton").addEventListener("click", () => {
      applySettings(readSettings());
      $("#settingsBackdrop").classList.remove("hidden");
    });
    $("#closeSettingsButton").addEventListener("click", () => $("#settingsBackdrop").classList.add("hidden"));
    $("#settingsBackdrop").addEventListener("click", (event) => {
      if (event.target === $("#settingsBackdrop")) $("#settingsBackdrop").classList.add("hidden");
    });
    $("#closePlaylistPickerButton").addEventListener("click", closePlaylistPicker);
    $("#playlistPickerBackdrop").addEventListener("click", (event) => {
      if (event.target === $("#playlistPickerBackdrop")) closePlaylistPicker();
    });
    $("#playlistBackButton").addEventListener("click", loadPlaylists);
    $("#exportPlaylistsButton").addEventListener("click", exportPlaylists);
    $("#importPlaylistsInput").addEventListener("change", (event) => importPlaylists(event.target.files?.[0]));
    $("#playlistForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const name = $("#playlistNameInput").value;
      if (!createPlaylist(name)) return;
      $("#playlistNameInput").value = "";
      loadPlaylists();
      showToast("再生リストを作成しました");
    });
    $("#quickPlaylistForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const list = createPlaylist($("#quickPlaylistNameInput").value, state.currentVideo);
      if (!list) return;
      $("#quickPlaylistNameInput").value = "";
      closePlaylistPicker();
      showToast(`「${list.name}」を作成して追加しました`);
    });
    $("#tabPreset").addEventListener("change", () => {
      const preset = TAB_PRESETS[$("#tabPreset").value];
      if (!preset) return;
      $("#customTabTitle").value = preset.title;
      $("#customFaviconUrl").value = preset.favicon;
    });
    $("#saveSettingsButton").addEventListener("click", saveSettings);
    $("#resetSettingsButton").addEventListener("click", () => {
      $("#darkModeToggle").checked = false;
      $("#personalizedRecommendationsToggle").checked = false;
      $("#tabPreset").value = "classroom";
      $("#customTabTitle").value = TAB_PRESETS.classroom.title;
      $("#customFaviconUrl").value = TAB_PRESETS.classroom.favicon;
      saveSettings();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        $("#settingsBackdrop").classList.add("hidden");
        closePlaylistPicker();
      }
    });
    window.addEventListener("pagehide", stopPlayback);
    document.querySelectorAll(".nav-item[data-route]").forEach((item) => item.addEventListener("click", () => {
      document.querySelectorAll(".nav-item").forEach((nav) => nav.classList.remove("active"));
      item.classList.add("active");
      const route = item.dataset.route;
      if (route === "history") return loadHistory();
      if (route === "playlists") return loadPlaylists();
      if (route === "trending") return loadHome("trending?region=JP", "急上昇");
      if (route === "news") return loadNews();
      if (route === "subscriptions") return loadSubscriptions();
      return loadHome();
    }));
    window.addEventListener("popstate", routeFromHash);
    window.addEventListener("hashchange", routeFromHash);
    applySettings(readSettings());
    state.subscriptions = readSubscriptions();
    state.playlists = readPlaylists();
    routeFromHash();
  </script>
</body>
</html>
